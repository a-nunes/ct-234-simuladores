# Configuração do site estático (SPA sem roteamento por URL).
# Incluída no contexto "http" da imagem nginx-unprivileged via /etc/nginx/conf.d/*.conf.
#
# IMPORTANTE: no nginx, um "add_header" dentro de um "location" DESCARTA todos os
# add_header herdados do "server". Por isso todos os cabeçalhos ficam no nível do
# server e o Cache-Control é escolhido por um "map" — nunca use add_header em location.

server_tokens off;

# HSTS só quando o proxy reverso (kamal-proxy) recebeu a requisição via HTTPS.
# Valor vazio → o nginx não emite o cabeçalho. Sem includeSubDomains/preload,
# que afetariam outros subdomínios do mesmo domínio.
map $http_x_forwarded_proto $ct234_hsts {
    default "";
    https   "max-age=31536000";
}

# Assets do Vite têm hash no nome → cache imutável; o resto revalida (ETag).
# A chave inclui o status: um 404 em /assets/ (aba antiga durante um deploy ou
# rollback) não pode ficar em cache por um ano.
map "$status:$uri" $ct234_cache_control {
    default                    "no-cache";
    ~^(200|304):/assets/       "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # IP real do cliente nos logs quando atrás do proxy (redes privadas do Docker).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Redirecionamentos relativos: não vaza a porta/host interno quando atrás de proxy.
    absolute_redirect off;
    port_in_redirect off;

    autoindex off;
    etag on;

    # Site estático: não há corpo de requisição legítimo.
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml image/x-icon;

    # Cabeçalhos de segurança (também aplicados a 404/405 graças ao "always").
    # CSP estrita: só recursos da própria origem, nada de inline/eval, sem frames.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $ct234_cache_control always;
    add_header Strict-Transport-Security $ct234_hsts always;

    # Apenas leitura.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Healthcheck do container (sem log).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos ocultos (.git, .env, ...) nunca são servidos.
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    # A aplicação não usa rotas por URL: caminho inexistente é 404, em vez de
    # devolver index.html com status 200. Diretórios também não são resolvidos
    # (sem redirect 301 nem listagem).
    location / {
        try_files $uri =404;
    }
}
