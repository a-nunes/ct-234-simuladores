# Execução endurecida do container (local ou no servidor).
#   docker compose up -d --build
# O serviço só escuta em 127.0.0.1: a exposição pública deve passar por um
# proxy reverso com TLS (Caddy/nginx/Traefik) — veja DEPLOY.md.
services:
  web:
    build:
      context: .
    image: ct-234-simuladores:latest
    container_name: ct-234-simuladores
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CT234_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      # pid e diretórios temporários do nginx-unprivileged ficam em /tmp
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
