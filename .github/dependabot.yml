version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Mesma política do .npmrc: só versões com pelo menos 14 dias de publicação.
    cooldown:
      default-days: 14
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
